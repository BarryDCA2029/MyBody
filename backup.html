<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>MY BODY Backup Bridge</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai",sans-serif;background:#edf4f6;color:#142036;margin:0;padding:24px}.box{max-width:560px;margin:40px auto;background:white;border-radius:24px;padding:24px;box-shadow:0 12px 30px #17354816}.box h1{margin:0 0 8px}.box p{color:#5d717b}.box button{width:100%;border:0;border-radius:16px;padding:15px;background:#173548;color:#fff;font-size:18px;font-weight:900}.status{margin-top:16px;padding:12px;border-radius:14px;background:#f7f9fa;font-size:14px}</style></head><body><div class="box"><h1>MY BODY</h1><p>Backup Bridge • ใช้บนเว็บไซต์เดียวกับไอคอนแอปเก่าที่มีข้อมูล</p><button onclick="exportData()">↑ สำรองข้อมูลเดิม</button><div class="status" id="status">ยังไม่ได้ตรวจข้อมูล</div></div><script>const KEY='mybody_v12_data';const s=document.getElementById('status');function count(o){return `น้ำหนัก ${(o.weights||[]).length} • อาหาร ${(o.foods||[]).length} • กิจกรรม ${(o.activities||[]).length} • น้ำ ${(o.water||[]).length} • Mounjaro ${(o.shots||[]).length}`};try{const r=localStorage.getItem(KEY);s.textContent=r?'พบข้อมูล: '+count(JSON.parse(r)):'ไม่พบข้อมูลเดิมใน storage ของหน้านี้';}catch(e){s.textContent='อ่านข้อมูลไม่ได้'}async function exportData(){try{const raw=localStorage.getItem(KEY);if(!raw){alert('ไม่พบข้อมูลเดิมในหน้านี้');return}const data=JSON.parse(raw),payload={app:'MY BODY',format:1,version:'1.9.5-bridge',exportedAt:new Date().toISOString(),storageKey:KEY,data},text=JSON.stringify(payload,null,2),blob=new Blob([text],{type:'application/json'}),name='MY-BODY-backup.json';if(typeof File!=='undefined'&&navigator.share&&navigator.canShare){const f=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'MY BODY Backup'});return}catch(e){if(e&&e.name==='AbortError')return}}}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){alert('สำรองไม่สำเร็จ')}}</script></body></html>
